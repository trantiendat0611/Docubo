name: Keep-alive

# Supabase pauses a free project after seven days of inactivity, and unpausing
# it is a manual click. Monday and Thursday puts the longest gap at four days.
#
# Unlike ci.yml, this workflow deliberately reaches a live service — that is the
# entire point. It still never touches Gemini: /api/health queries Postgres and
# nothing else, so it costs no generation quota.
#
# The URL is public, so this needs no secrets.

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    name: Wake the database
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        run: |
          # --fail turns a 503 into a non-zero exit, so a database that has
          # already gone to sleep shows up as a red run rather than a green one
          # with an unread body.
          curl --fail --show-error --silent --max-time 30 \
            https://docubo.vercel.app/api/health
