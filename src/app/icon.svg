<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Docubo">
  <!--
    A page with a citation bracket cut into it. The bracket is the product's
    signature — every answer carries [n] markers back to a page — so the mark
    says what the tool does rather than spelling the first letter of its name.
    Drawn on a 32px grid with 2px strokes so it survives at 16px.
  -->
  <rect width="32" height="32" rx="7" fill="#2f5fd8"/>
  <path d="M11 8h8.5L23 11.5V24a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"
        fill="#ffffff" fill-opacity="0.14"/>
  <path d="M11.5 8.5h7.9l3.1 3.1V24a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1-.5-.5V9a.5.5 0 0 1 .5-.5Z"
        fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M19 8.6V12h3.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- citation bracket -->
  <path d="M15.4 15.6h-1.6v5.2h1.6M18.2 15.6h1.6v5.2h-1.6"
        fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
