<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Docubo">
  <!--
    A chat bubble with a citation bracket cut into it. The bubble reads as
    "chatbot" at a glance; the bracket is what makes this one different —
    every reply carries [n] markers back to a page. Drawn on a 32px grid
    with 2px strokes so it survives at 16px.
  -->
  <rect width="32" height="32" rx="7" fill="#3450c9"/>
  <path d="M6 6h20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H13.4L8 25.6V21H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"
        fill="#ffffff" fill-opacity="0.14"/>
  <path d="M6 6h20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H13.4L8 25.6V21H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"
        fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- citation bracket -->
  <path d="M14 11.2h-2.3v6.8h2.3M18 11.2h2.3v6.8h-2.3"
        fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
